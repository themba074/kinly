name: Backend verification

on:
  pull_request:
    paths:
      - "backend/**"
      - "compose.yaml"
      - ".github/workflows/backend.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "compose.yaml"
      - ".github/workflows/backend.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Verify backend
        working-directory: backend
        run: |
          chmod +x gradlew
          ./gradlew test --no-daemon

