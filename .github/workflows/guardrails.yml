name: Repository guardrails

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify repository safety and formatting
        shell: pwsh
        run: ./scripts/verify-repository.ps1
      - name: Scan locked dependencies with OSV
        shell: pwsh
        run: ./scripts/scan-dependencies.ps1

