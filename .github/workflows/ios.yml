name: iOS verification

on:
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"

permissions:
  contents: read

jobs:
  test:
    if: github.event.repository.private == false
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify iOS foundation
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          derived_data="$RUNNER_TEMP/KinlyDerivedData"

          xcodebuild \
            -project ios/Kinly.xcodeproj \
            -scheme Kinly \
            -configuration Debug \
            -sdk iphonesimulator \
            -showBuildSettings \
            | grep "IPHONEOS_DEPLOYMENT_TARGET = 17.0"

          simulator_id="$(
            xcrun simctl list devices available --json \
              | ruby -rjson -e '
                  devices = JSON.parse(STDIN.read).fetch("devices").values.flatten
                  phone = devices.find { |device| device["isAvailable"] && device["name"].start_with?("iPhone") }
                  abort "No available iPhone simulator" unless phone
                  puts phone.fetch("udid")
                '
          )"

          xcodebuild test \
            -project ios/Kinly.xcodeproj \
            -scheme Kinly \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${simulator_id}" \
            -derivedDataPath "$derived_data" \
            CODE_SIGNING_ALLOWED=NO

          xcodebuild build \
            -project ios/Kinly.xcodeproj \
            -scheme Kinly \
            -configuration Release \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$derived_data" \
            CODE_SIGNING_ALLOWED=NO

          release_binary="$derived_data/Build/Products/Release-iphonesimulator/Kinly.app/Kinly"
          test -f "$release_binary"
          if strings "$release_binary" | grep -F "Synthetic preview only"; then
            echo "Debug showcase copy leaked into the Release binary" >&2
            exit 1
          fi
