spring:
  application:
    name: kinly-backend
  datasource:
    url: ${KINLY_DATABASE_URL:jdbc:postgresql://localhost:5433/kinly}
    username: ${KINLY_DATABASE_USER:kinly}
    password: ${KINLY_DATABASE_PASSWORD:kinly-local-only}
  data:
    redis:
      host: ${KINLY_REDIS_HOST:localhost}
      port: ${KINLY_REDIS_PORT:6380}
  flyway:
    locations: classpath:db/migration
    validate-migration-naming: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-components: never
      show-details: never
  health:
    readinessstate:
      enabled: true
    livenessstate:
      enabled: true

logging:
  structured:
    format:
      console: ecs

server:
  error:
    include-binding-errors: never
    include-message: never
    include-stacktrace: never
  shutdown: graceful

